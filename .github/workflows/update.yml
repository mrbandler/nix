name: Update flake inputs

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update inputs and regenerate flake.nix
        id: update
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          nix flake update --commit-lock-file
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "All inputs are up to date"
            exit 0
          fi
          # flake.nix is generated by flake-file, which was just bumped as well:
          # regenerate it with the new generator, then re-lock any input whose URL changed.
          nix run .#write-flake
          nix flake lock
          git add flake.nix flake.lock
          git commit --quiet --amend -m "chore(deps): update flake inputs" -m "$(git log -1 --format=%b)"
          {
            echo "summary<<EOF"
            git log -1 --format=%b
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: update/flake-inputs
          delete-branch: true
          title: "chore(deps): update flake inputs"
          body: |
            ```
            ${{ steps.update.outputs.summary }}
            ```

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr merge --auto --rebase "${{ steps.pr.outputs.pull-request-number }}"
